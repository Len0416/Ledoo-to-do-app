<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ledoo — Lista de tareas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <!-- Estilos -->
  <link rel="stylesheet" href="/assets/styles/styles.css" />
  <link rel="stylesheet" href="/assets/styles/mediaqueries.css" />
</head>
<body class="theme-dark">
  <div id="app">
    <!-- Topbar -->
    <header class="topbar" aria-label="Barra superior">
      <span class="logo">Ledoo</span>
      <label class="search">
        <input type="search" placeholder="Buscar tareas…" />
      </label>
      <button class="btn-icon" data-panel="panel-perfil" aria-label="panel-perfil">👤</button>
      <button class="btn-icon" data-panel="panel-secciones-principales" aria-label="panel-secciones-principales">📒</button>
      <button class="btn-icon" data-panel="panel-secciones-personales" aria-label="panel-secciones-personales">📋</button>
      <!-- Botón hamburguesa -->
      <button class="btn-icon setting" data-panel="settings-panel" aria-label="Abrir ajustes">⚙️</button>
    </header>

    <!-- Paneles contextuales debajo del topbar -->
    <aside class="context-panel" id="panel-perfil">
      <div class="panel-header">
        <h3>Perfil</h3>
        <div class="panel-options">
          <button class="btn-outline">Cerrar sesión</button>
          <button class="btn-icon close-panel" aria-label="Cerrar">✖</button>
        </div>
      </div>
      <div class="panel-body">
        <img src="assets/images/icons/User.png" alt="Icono de perfil de usuario">
        <div class="panel-content">
          <p>Nombre de usuario</p>
          <p>correousuario@gmail.com</p>
    </aside>

    <aside class="context-panel" id="panel-secciones-principales">
      <div class="panel-header">
        <h3>Secciones principales</h3>
        <div class="panel-options">
          <button class="btn-icon close-panel" aria-label="Cerrar">✖</button>
        </div>
      </div>
      <div class="panel-body">
        <button class="btn-outline"><img src="assets/images/icons/Sun.png" alt="Icono de sección para hoy"><p>Hoy</p></button>
        <button class="btn-outline"><img src="assets/images/icons/Star.png" alt="Icono de sección para hoy"><p>Importante</p></button>
        <button class="btn-outline"><img src="assets/images/icons/Check square.png" alt="Icono de sección para hoy"><p>Tareas</p></button>
        <button class="btn-outline"><img src="assets/images/icons/Calendar.png" alt="Icono de sección para hoy"><p>Planificado</p></button>
      </div>
    </aside>

    <aside class="context-panel" id="panel-secciones-personales">
      <div class="panel-header">
        <h3>Secciones personales</h3>
        <button class="btn-outline create-list" aria-label="CrearLista">Crear lista</button>
        <button class="btn-icon close-panel" aria-label="Cerrar">✖</button>
      </div>
      <div class="panel-body">
        <button class="btn-outline">Estudio</button>
        <button class="btn-outline">Trabajo</button>
        <button class="btn-outline">Personal</button>
      </div>
    </aside>

    <!-- Sidebar -->
    <aside class="sidebar" aria-label="Barra lateral">
      <div class="user-card">
        <img src="assets/images/icons/User.png" alt="Icono de perfil de usuario">
        <div class="user-info">
          <div class="user-name">Nombre de usuario</div>
          <div class="user-email">correousuario@gmail.com</div>
        </div>
      </div>

      <nav class="nav-sections" aria-label="Secciones">
        <button class="nav-item is-active">
          <img src="assets/images/icons/Sun.png" alt="Icono de sección para hoy">
          <span>Hoy</span>
        </button>
        <button class="nav-item">
          <img src="assets/images/icons/Star.png" alt="Icono de sección para importante">
          <span>Importante</span>
        </button>
        <button class="nav-item">
          <img src="assets/images/icons/Check square.png" alt="Icono de sección para tareas">
          <span>Tareas</span>
        </button>
        <button class="nav-item">
          <img src="assets/images/icons/Calendar.png" alt="Icono de sección para planificado">
          <span>Planificado</span>
        </button>
      </nav>

      <div class="divider" role="separator"></div>

      <div class="lists">
        <div class="lists-header">
          <span>Mis listas</span>
        </div>
        <ul class="list-group">
          <li><button class="list-item">Trabajo</button></li>
          <li><button class="list-item">Personal</button></li>
          <li><button class="list-item">Estudio</button></li>
          <button class="btn-outline create-list" aria-label="CrearLista">Crear lista</button>
        </ul>
      </div>
    </aside>

    <!-- Main content -->
    <main class="main" aria-label="Contenido principal">
      <header class="main-header">
        <h1>Hoy</h1>
        <div class="actions">
          <label class="search">
            <span class="sr-only">Buscar tareas</span>
            <input type="search" placeholder="Buscar tareas…" />
          </label>
          <button class="btn" aria-label="Nueva tarea">Nueva tarea</button>
        </div>
      </header>

      <section class="tasks" aria-label="Lista de tareas">
        <!-- Aquí se insertan las tareas dinámicas -->
      </section>
      <form class="task-form">
        <input type="text" class="task-input" placeholder="Nueva tarea…" required />
        <input type="datetime-local" class="task-date" />
        <label class="task-important">
          <input type="checkbox" />
          Importante
        </label>
        <button type="submit">Agregar</button>
      </form>
    </main>
  </div>

  <!-- Panel de ajustes hamburguesa -->
  <aside class="settings-panel open" id="settings-panel" aria-label="Ajustes">
    <div class="settings-header">
      <h3>Ajustes</h3>
      <button class="btn-icon close-settings" aria-label="Cerrar ajustes">✖</button>
    </div>
    <div class="section-actions">
      <button class="btn-outline">Claro</button>
      <button class="btn-outline is-active">Oscuro</button>
    </div>
    <div class="wallpaper-grid">
      <button class="wallpaper-card"><img src="assets/images/wallpapers/Fondo1.png" alt="Montaña" /></button>
      <button class="wallpaper-card"><img src="assets/images/wallpapers/Fondo2.png" alt="Ciudad" /></button>
      <button class="wallpaper-card"><img src="assets/images/wallpapers/Fondo3.png" alt="Costa" /></button>
      <button class="wallpaper-card"><img src="assets/images/wallpapers/Fondo4.png" alt="Lago" /></button>
      <button class="wallpaper-card"><img src="assets/images/wallpapers/Fondo5.png" alt="Bosque" /></button>
      <button class="wallpaper-card"><img src="assets/images/wallpapers/Fondo6.png" alt="Valle" /></button>
    </div>
  </aside>

  <!-- Scripts -->
  <script type="module" src="/assets/scripts/tasks/task-init.js"></script>
  <script type="module" src="/assets/scripts/tasks/task-create.js"></script>
  <script type="module" src="/assets/scripts/tasks/task-storage.js"></script>
  <script type="module" src="/assets/scripts/settings/panel-init.js"></script>
  <script type="module" src="/assets/scripts/settings/panel-manager.js"></script>
  <script type="module" src="/assets/scripts/settings/settings.js"></script>
  <script type="module" src="/assets/scripts/settings/appearance.js"></script>
</body>
</html>
